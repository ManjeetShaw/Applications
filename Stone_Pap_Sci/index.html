<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stone Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
  <h1 class="title">Stone Paper Scissors</h1>

  <div class="status">Choose your move</div>

  <div class="hands">
    <div class="hand computer">❔</div>
    <div class="hand player">❔</div>
  </div>

  <div class="score">
    <span>Computer: <b class="computerScore">0</b></span>
    <span>Player: <b class="playerScore">0</b></span>
  </div>

  <div class="buttons">
    <button data-choice="STONE">🪨 Stone</button>
    <button data-choice="PAPER">📄 Paper</button>
    <button data-choice="SCISSORS">✂️ Scissors</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
